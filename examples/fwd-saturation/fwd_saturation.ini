[Load Counts]
_module = countess.plugins.csv
_class = LoadCsvPlugin
_position = 150 250
_notes = Variant counts before and after selection, as a read-level variant caller reports them: genomic HGVS, with indels placed wherever the aligner put them.
files.0.filename = 'counts.csv'
filename_column = False
delimiter = ','
header = True
columns.0.name = 'hgvs'
columns.0.type = 'STRING'
columns.1.name = 'pre'
columns.1.type = 'INTEGER'
columns.2.name = 'post'
columns.2.type = 'INTEGER'

[HGVS Weaver]
_module = countess_weaver.plugin
_class = WeaverPlugin
_position = 400 250
_parent.0 = Load Counts
_notes = Normalise each genomic variant by the 3' rule, project it onto the FWD transcript, and predict its protein consequence.
column = 'hgvs'
reference.source = 'refseq'
reference.fasta = 'synthetic.fa'
reference.gff3 = 'synthetic.gff3'
steps.0.operation = 'normalize'
steps.0.output = 'hgvs_g'
steps.1.operation = 'g_to_c'
steps.1.target = 'NM_000099.1'
steps.1.normalise = True
steps.1.output = 'hgvs_c'
steps.2.operation = 'c_to_p'
steps.2.output = 'hgvs_p'
on_error = 'column'
error_column = 'weaver_error'

[Save Annotated]
_module = countess.plugins.csv
_class = SaveCsvPlugin
_position = 700 150
_parent.0 = HGVS Weaver
_notes = Every input row with its g., c. and p. descriptions, and weaver's reason for any row it refused.
filename = 'output/annotated.csv'
header = True
delimiter = ','
quoting = True
sorting.0.order_by = 'hgvs'

[Collapse by Variant]
_module = countess.plugins.group_by
_class = GroupByPlugin
_position = 700 400
_parent.0 = HGVS Weaver
_notes = Different spellings of one change normalise to one description, so their counts can be summed.
columns.0._label = 'hgvs'
columns.1._label = 'pre'
columns.1.sum = True
columns.2._label = 'post'
columns.2.sum = True
columns.3._label = 'hgvs_g'
columns.4._label = 'hgvs_c'
columns.4.index = True
columns.5._label = 'hgvs_p'
columns.5.index = True
columns.6._label = 'weaver_error'
join = False

[Save Collapsed]
_module = countess.plugins.csv
_class = SaveCsvPlugin
_position = 900 400
_parent.0 = Collapse by Variant
filename = 'output/collapsed.csv'
header = True
delimiter = ','
quoting = True
sorting.0.order_by = 'hgvs_c'
