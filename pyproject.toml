[project]
name = "countess-weaver"
dynamic = ["version"]
description = "CountESS plugin applying hgvs-weaver's HGVS normalisation and projection to columns of variants"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "countess>=0.1.27,<0.2",
    "hgvs-weaver>=0.7.0,<0.8",
]

[project.optional-dependencies]
# weaver's RefSeq GFF3 + FASTA provider imports both.
refseq = [
    "hgvs>=1.5",
    "pysam>=0.20",
]
dev = [
    "pytest>=8",
    "pytest-socket>=0.7",
]

[project.entry-points.countess_plugins]
weaver = "countess_weaver.plugin:WeaverPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/countess_weaver/__init__.py"
pattern = "VERSION = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/countess_weaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-socket"

[tool.black]
line-length = 120
